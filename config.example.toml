# 配置示例：复制为 config.toml 后按需修改（config.toml 不会提交到 git）。
# 没写的项使用代码里的默认值，写错的项名会在启动时报错。

[audio]
source = "system"          # system = 电脑正在播放的声音；file = 用音频文件模拟（调试用）
# file = "samples/fr_demo.wav"
# file_speed = 1.0         # 文件模拟的播放倍速，1.0 = 实时

[vad]
threshold = 0.5            # 判定为“有人说话”的概率阈值
min_silence_ms = 400       # 静音超过这么久，认为一句话说完
speech_pad_ms = 200        # 句首往前多留一点音频，避免吞掉第一个音

[asr]
backend = "auto"           # auto：macOS 用 mlx，Windows 用 faster-whisper
model = "mlx-community/whisper-large-v3-mlx"
language = "fr"
step_s = 0.6               # 说话期间每隔多久重新识别一次
max_buffer_s = 12.0        # 识别缓冲区的上限，超过就强制切分
quantize_bits = 4          # macOS：在内存里把同一个模型量化成 4 位，识别快约 25%（0 = 不量化）
# 以下只对 Windows 的 faster-whisper 后端有效
faster_whisper_model = "large-v3"
device = "auto"            # auto / cuda / cpu
compute_type = "default"   # 显卡上可用 float16；纯 CPU 可用 int8（large-v3 在 CPU 上基本做不到实时）
allow_download = false     # 第一次使用要下载约 3 GB 的模型，确认后改成 true

[translate]
# 任何兼容 OpenAI Chat Completions 接口的服务都可以，改 base_url / model / api_key_env / extra_body 即可。
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"   # 密钥写在 .env 里，不要写在这里
target_language = "简体中文"
context_sentences = 3
temperature = 0.2
speculative = true           # 投机翻译：句子还没完全确认就先翻，中文早出现约 0.9 秒；代价是请求数约为 3 倍
speculative_max_words = 12   # 凑成一句还要靠超过这么多个暂定词时不投机
# DeepSeek 默认开启“思考模式”（先思考再输出，慢很多），同传必须关掉；换别的服务商时按它的文档改或删掉
extra_body = { thinking = { type = "disabled" } }
# glossary = { "IA" = "人工智能", "TP" = "实验课" }
#
# 例：本地 Ollama（不需要密钥，但要本机跑得动模型）
# base_url = "http://localhost:11434/v1"
# model = "你在 Ollama 里下载的模型名"
# api_key_env = ""
# extra_body = {}

[ui]
mode = "overlay"           # overlay = 透明悬浮窗；console = 只在终端输出
font_size = 26
opacity = 0.6
max_lines = 3

[transcript]
enabled = true
dir = "transcripts"        # 会话记录保存位置，可以写绝对路径
